name: SonarQube Quality Check

on:
  push:
    branches: [ "v3.x/staging" ]
  pull_request:
    branches: [ "v3.x/staging" ]
    types: [opened, synchronize, reopened, ready_for_review]


jobs:
  analyze-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout PR head with limited history
        uses: actions/checkout@v4
        with:
          ref: v3.x/staging

      - name: SonarQube Scan
        continue-on-error: false
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=zowe_sample-iframe-app
            -Dsonar.organization=zowe
            -Dsonar.sources=web
            -Dsonar.test.inclusions=**/*.(spec|test).ts,**/*.(spec|test).tsx,**/*.(spec|test).js,**/*.(spec|test).jsx
            -Dsonar.javascript.lcov.reportPaths=web/coverage/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
